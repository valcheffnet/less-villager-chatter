import java.util.concurrent.TimeUnit

// NeoForge targets (1.21.1 and newer). NeoForge runs on Mojang's names, so the mixins need no refmap.
apply plugin: 'java-library'
apply plugin: 'net.neoforged.moddev'
apply from: rootProject.file('gradle/common.gradle')

sourceSets {
	main {
		java.srcDirs = commonMainJava + commonClientJava
		resources.srcDirs = commonMainResources + commonClientResources
	}
	// A second mod, loaded only by runSmokeTest and runClientSmokeTest: starts a dedicated server or a client,
	// checks the mod, then exits.
	smoketest {
		java.srcDirs = smokeTestJava
		resources.srcDirs = smokeTestResources
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
}

neoForge {
	version = project.neo_version

	addModdingDependenciesTo sourceSets.smoketest

	mods {
		lessvillagerchatter {
			sourceSet sourceSets.main
		}
		lessvillagerchattertest {
			sourceSet sourceSets.smoketest
		}
	}

	runs {
		client {
			client()
		}
		server {
			server()
			programArgument '--nogui'
		}
		smokeTest {
			server()
			programArgument '--nogui'
			gameDirectory = project.file('run-smoketest')
			loadedMods = [mods.lessvillagerchatter, mods.lessvillagerchattertest]
		}
		clientSmokeTest {
			client()
			gameDirectory = project.file('run-client-smoketest')
			loadedMods = [mods.lessvillagerchatter, mods.lessvillagerchattertest]
		}
	}
}

def smokeDir = project.file('run-smoketest')
tasks.named('prepareSmokeTestRun') {
	doFirst {
		smokeDir.mkdirs()
		new File(smokeDir, 'eula.txt').text = 'eula=true\n'
		new File(smokeDir, 'server.properties').text = 'online-mode=false\nspawn-protection=0\nserver-port=25690\n'
	}
}

// Fail the build unless the server wrote a passing result (it halts itself right after the checks).
def smokeResult = new File(smokeDir, 'lvc-smoketest-result.txt')
tasks.matching { it.name == 'runSmokeTest' }.configureEach {
	doFirst { smokeResult.delete() }
	doLast {
		if (!smokeResult.exists() || !smokeResult.text.startsWith('LVC-SMOKETEST PASSED')) {
			throw new GradleException("Smoke test did not pass: " + (smokeResult.exists() ? smokeResult.text : 'the server never reached the checks'))
		}
	}
}

// The client smoke test (./gradlew :neoforge-1.21.1:runClientSmokeTest) starts from default settings, muted,
// and fails the build unless the client wrote a passing result.
def clientDir = project.file('run-client-smoketest')
def clientResult = new File(clientDir, 'lvc-client-smoketest-result.txt')
def clientOptions = clientSmokeOptions
tasks.named('prepareClientSmokeTestRun') {
	doFirst {
		clientDir.mkdirs()
		clientResult.delete()
		new File(clientDir, 'config/lessvillagerchatter.properties').delete()
		new File(clientDir, 'options.txt').text = clientOptions
	}
}
tasks.matching { it.name == 'runClientSmokeTest' }.configureEach {
	doLast {
		if (!clientResult.exists() || !clientResult.text.startsWith('LVC-CLIENT-SMOKETEST PASSED')) {
			throw new GradleException("Client smoke test did not pass: " + (clientResult.exists() ? clientResult.text : 'the client never reached the checks'))
		}
	}
}

// Run the same checks on a real NeoForge server with the release jar (./gradlew :neoforge-1.21.1:prodSmokeTest),
// to catch anything the dev environment hides: the jar's own metadata, resources and mixin config. Installs the
// server once into build/prod-server with the official NeoForge installer. Both processes write to log files
// there: an inherited console that nobody reads fills up and blocks them.
def smokeJar = tasks.register('smokeTestJar', Jar) {
	from sourceSets.smoketest.output
	archiveClassifier = 'smoketest'
	destinationDirectory = layout.buildDirectory.dir('smoketest')
}

def neoVersion = project.neo_version
def prodServer = project.layout.buildDirectory.dir('prod-server').get().asFile
def installerUrl = "https://maven.neoforged.net/releases/net/neoforged/neoforge/${neoVersion}/neoforge-${neoVersion}-installer.jar"
def javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(javaRelease) }
def modJar = tasks.named('jar').flatMap { it.archiveFile }
def testJar = smokeJar.flatMap { it.archiveFile }

tasks.register('prodSmokeTest') {
	dependsOn 'jar', smokeJar
	def javaExe = javaLauncher.map { it.executablePath.asFile.absolutePath }
	doLast {
		def java = javaExe.get()
		def argsFile = new File(prodServer, "libraries/net/neoforged/neoforge/${neoVersion}/win_args.txt")
		if (!argsFile.exists()) {
			prodServer.mkdirs()
			def installer = new File(prodServer, 'installer.jar')
			new URL(installerUrl).withInputStream { input -> installer.withOutputStream { it << input } }
			def install = new ProcessBuilder(java, '-jar', installer.absolutePath, '--installServer', prodServer.absolutePath)
					.directory(prodServer).redirectErrorStream(true)
					.redirectOutput(new File(prodServer, 'installer-output.log')).start()
			if (!install.waitFor(15, TimeUnit.MINUTES)) {
				install.destroyForcibly()
				throw new GradleException('NeoForge installer did not finish in 15 minutes')
			}
			if (install.exitValue() != 0) throw new GradleException('NeoForge installer failed')
		}
		def mods = new File(prodServer, 'mods')
		mods.mkdirs()
		mods.listFiles().each { it.delete() }
		[modJar.get().asFile, testJar.get().asFile].each { jar -> new File(mods, jar.name).bytes = jar.bytes }
		new File(prodServer, 'eula.txt').text = 'eula=true\n'
		new File(prodServer, 'server.properties').text = 'online-mode=false\nspawn-protection=0\nserver-port=25690\n'
		def result = new File(prodServer, 'lvc-smoketest-result.txt')
		result.delete()
		def server = new ProcessBuilder(java, "@libraries/net/neoforged/neoforge/${neoVersion}/win_args.txt", 'nogui')
				.directory(prodServer).redirectErrorStream(true)
				.redirectOutput(new File(prodServer, 'server-output.log')).start()
		server.outputStream.close()
		if (!server.waitFor(10, TimeUnit.MINUTES)) {
			server.destroyForcibly()
		}
		if (!result.exists() || !result.text.startsWith('LVC-SMOKETEST PASSED')) {
			throw new GradleException("Production smoke test did not pass: " + (result.exists() ? result.text : 'the server never reached the checks'))
		}
	}
}
