# NeoForge 21.1 still requires the loader lines; newer versions accept them.
modLoader="javafml"
loaderVersion="[1,)"
license="All Rights Reserved"
issueTrackerURL="https://github.com/valcheffnet/less-villager-chatter/issues"

[[mods]]
modId="lessvillagerchatter"
version="${version}"
displayName="Less Villager Chatter"
displayURL="https://www.curseforge.com/minecraft/mc-mods/less-villager-chatter"
${icon_key}="assets/lessvillagerchatter/icon.png"
authors="SasnycoN"
description='''
Villagers and wandering traders make their idle "hmm" sound less often, and quieter if you want. Works on a dedicated server with vanilla clients; in singleplayer the settings are under Mods > Config.
'''

[[mixins]]
config="lessvillagerchatter.mixins.json"

[[mixins]]
config="lessvillagerchatter.client.mixins.json"

[[dependencies.lessvillagerchatter]]
modId="neoforge"
type="required"
versionRange="${loader_dep}"
ordering="NONE"
side="BOTH"

[[dependencies.lessvillagerchatter]]
modId="minecraft"
type="required"
versionRange="${minecraft_dep}"
ordering="NONE"
side="BOTH"
