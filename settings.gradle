pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'net.fabricmc.fabric-loom' version loom_version
		id 'net.fabricmc.fabric-loom-remap' version loom_version
		id 'net.neoforged.moddev' version moddev_version
		id 'net.neoforged.moddev.legacyforge' version moddev_version
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'less-villager-chatter'

// One subproject per loader and Minecraft version: versions/<loader>-<minecraft>/gradle.properties.
file('versions').eachDir { dir ->
	if (new File(dir, 'gradle.properties').exists()) {
		include dir.name
		project(":${dir.name}").projectDir = dir
	}
}
